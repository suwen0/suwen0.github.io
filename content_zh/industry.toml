[[items]]
title = "非流动性交易对手的 CDS 利差估计"
content = """
- 交易对手信用风险估值与信用估值调整（CVA）需要可靠的CDS利差，但许多交易对手缺乏活跃的 CDS 报价。

- 估计CDS利差是Basel协会的监管要求，因此已经成为投资银行/商业银行/交易商所需解决的实际问题。

- 多数现有机构采用市场平均或插值方法估计CDS利差，但这样的方法尚未考虑公司独有信息。我们的方法主要依靠发掘权益市场-信用市场的关系来估计非流动性交易对手的 CDS 利差，同时我们的模型允许我们用期权或衍生品组合来对冲我们面临的信用风险。
"""
