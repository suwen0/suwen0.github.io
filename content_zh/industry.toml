title = "基于路径签名的信用模型"
subtitle = "与 M. Arnsdorf、B. Horvath 和 S. Schismenos 合作"
content = """
本项目研究基于路径签名的结构化信用模型。路径签名为表示底层过程的历史信息提供了系统方法，使模型能够纳入路径依赖。本研究将结构化信用模型与路径的统计表示相结合，探索其在信用市场中的应用。
"""
