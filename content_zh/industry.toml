[[items]]
title = "金融市场中的路径依赖建模"
content = """
- 路径依赖广泛存在于金融定价与风险管理中。例如，企业违约可以建模为其资产价值首次触及违约边界的事件，因此，信用风险的刻画需要考虑资产价值的演化路径。

- 路径签名（Signature）为刻画和建模路径依赖提供了系统性的数学工具。我们的研究围绕基于路径签名的模型，在统计学习与无套利建模方面建立了基础性理论结果。

- 在此基础上，我们将路径签名引入资产动态建模，构建兼容经典粗糙波动率模型的灵活框架，为路径依赖产品的定价与风险管理提供模型支持。
"""
