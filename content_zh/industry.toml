[[items]]
title = "信用市场中的路径依赖建模"
content = """
金融风险可能取决于过程的整条演化路径：企业价值触及违约边界即可触发违约，路径依赖合约的收益也与价格随时间的变化有关。因此，如何将路径信息纳入模型，是金融定价与风险管理中的重要问题。我的研究利用路径签名构建能够保留历史信息的灵活随机模型。其中一项应用是结构化信用建模：通过共同的企业价值过程，将违约概率、CDS 期限结构和股票期权价格联系起来。
"""
