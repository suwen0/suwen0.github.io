title = "半参数股票–信用模型"
subtitle = "与 M. Arnsdorf、B. Horvath 和 S. Schismenos 合作"
content = """
本项目研究利用股票市场信息估计信用违约互换（CDS）利差的半参数模型。我们将股票与信用市场之间的建模关系与灵活的统计方法相结合，并与已有信用风险模型进行实证比较。这项研究将半参数金融计量方法用于信用利差估计中的实际问题。
"""
