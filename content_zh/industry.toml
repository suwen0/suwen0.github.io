[[items]]
title = "非流动性交易对手的 CDS 利差估计"
content = """
- 交易对手信用风险估值与信用估值调整（CVA）的计算需要可靠的 CDS 利差，但许多交易对手缺乏活跃的 CDS 报价。

- 估计非流动性交易对手的信用利差是巴塞尔 CVA 标准法下的一项监管要求，也是投资银行与交易商在日常定价和风险管理中面临的重要实际问题。大多数金融机构采用市场平均或插值的估计方法，但这种方法难以充分反映企业特有的风险信息。

- 我们的研究发掘权益市场与信用市场之间的联系，利用企业层面的权益市场信息估计非流动性交易对手的 CDS 利差，同时为利用期权及其他衍生品组合对冲信用风险提供模型支持。
"""
