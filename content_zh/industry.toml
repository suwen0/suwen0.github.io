[[items]]
title = "非流动性交易对手的 CDS 利差估计"
content = """
交易对手信用风险估值与信用估值调整（CVA）需要可靠的信用利差，但许多交易对手缺乏活跃的 CDS 报价。基于市场分组构造的代理利差可能难以反映企业特有的风险，因此，非流动性信用利差估计是金融机构面临的重要实际问题。我的研究利用股票市场信息，特别是期权隐含波动率，在缺乏直接 CDS 报价时估计信用利差。目标是在能够用市场可观测数据校准的框架中，反映不同企业的信用质量及其随市场变化的特征。
"""
image = "/images/industry/spec-core.png"
imageAlt = "估计非流动性交易对手 CDS 利差的研究图"
