[[items]]
title = "Path-Dependent Modeling in Financial Markets"
content = """
- Path dependence plays an important role in financial markets. For example, default may occur when a firm’s value first crosses a barrier, making its trajectory central to pricing and risk management.

- Signatures provide a systematic framework for modeling path dependence. Our research establishes foundational statistical and no-arbitrage results for signature-based models.

- Building on these foundations, we develop flexible models of asset dynamics that incorporate path signatures and accommodate established rough volatility models.
"""
