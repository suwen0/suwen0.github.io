title = "Semiparametric Equity–Credit Modelling"
subtitle = "Joint work with M. Arnsdorf, B. Horvath and S. Schismenos"
content = """
This project develops a semiparametric model for estimating credit default swap (CDS) spreads using equity-market information. It combines equity–credit modelling with a flexible statistical specification and evaluates the resulting estimates against established credit-risk benchmarks. The research connects semiparametric financial econometrics with practical questions in credit spread estimation.
"""
