[[items]]
title = "Estimating CDS Spreads for Illiquid Counterparties"
content = """
Reliable credit spreads are essential for valuing counterparty risk and calculating credit valuation adjustments (CVA), but many counterparties do not have liquid CDS quotes. Broad market proxies can miss firm-specific risk, making the estimation of illiquid credit spreads an important practical problem. My research draws on equity-market information, particularly option-implied volatility, to estimate CDS spreads when direct quotes are unavailable. The aim is to capture differences in credit quality and respond to changing market conditions within a framework that can be calibrated to observable data.
"""
