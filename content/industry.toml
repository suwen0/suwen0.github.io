[[items]]
title = "Path-Dependent Modeling in Credit Markets"
content = """
Financial risks can depend on an entire trajectory: default may occur as soon as a firm's value crosses a barrier, and path-dependent contracts depend on the evolution of prices over time. Capturing this information is important for pricing and risk management. My research uses path signatures to build flexible stochastic models that retain information about past dynamics. Applications include structural credit modelling, where a common firm-value process links default probabilities, CDS term structures and equity option prices.
"""
