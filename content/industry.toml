[[items]]
title = "Signature-Based Credit Models"
subtitle = "Joint work with M. Arnsdorf, B. Horvath and S. Schismenos"
content = """
This project studies signature-based structural models for credit markets. Path signatures provide a systematic way to represent the history of an underlying process and introduce path dependence into credit modelling. The research brings together structural credit models and statistical representations of paths to explore applications in credit markets.
"""
