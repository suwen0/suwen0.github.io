[[items]]
title = "Estimating CDS Spreads for Illiquid Counterparties"
content = """
- CDS spreads are essential for valuing counterparty credit risk and calculating credit valuation adjustments (CVA), yet many counterparties lack liquid CDS quotes.

- Estimating proxy credit spreads for illiquid counterparties is required under Basel’s standardised approach to CVA risk and remains a practical challenge for major dealer banks.

- Our research draws on equity-market information to uncover and model the links between equity and credit markets. The resulting methods support daily credit risk valuation and provide a framework for hedging credit risk with equity options.
"""
